<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latih Tubi PKSK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: kertas peperiksaan dalam talian — bar atas melekat (timer + hantar), satu soalan di tengah, grid nombor soalan untuk lompat. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #f4f6fa;
  --ink: #18223a;
  --ink-soft: #56607a;
  --line: #d6dce8;
  --brand: #1f4e8c;
  --brand-soft: #e1eaf7;
  --amber: #b06d00;
  --amber-soft: #fff1d6;
  --ok: #1b8553;
  --ok-soft: #daf3e6;
  --bad: #c23a3a;
  --bad-soft: #fde2e0;
  --f-display: "Baloo 2", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1525; --surface: #18213a; --surface-2: #1f2a47; --ink: #e9eefa; --ink-soft: #a6b0c8; --line: #2e3a5c;
    --brand: #8fb6f2; --brand-soft: #22335a; --amber: #ffc457; --amber-soft: #3a2f14;
    --ok: #5bd69b; --ok-soft: #163a2a; --bad: #ff8a83; --bad-soft: #452124; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1525; --surface: #18213a; --surface-2: #1f2a47; --ink: #e9eefa; --ink-soft: #a6b0c8; --line: #2e3a5c;
  --brand: #8fb6f2; --brand-soft: #22335a; --amber: #ffc457; --amber-soft: #3a2f14;
  --ok: #5bd69b; --ok-soft: #163a2a; --bad: #ff8a83; --bad-soft: #452124; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
.wrap { max-width: 900px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; }
button { font-family: inherit; }
button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.btn { font: 800 15px var(--f-body); border-radius: 999px; padding: 10px 20px; cursor: pointer; border: 2px solid var(--brand); background: var(--brand); color: var(--surface); min-height: 44px; }
.btn.ghost { background: transparent; color: var(--brand); }
.btn.warn { background: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.eyebrow { font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--amber); }
.muted { color: var(--ink-soft); }

/* Home */
.hero { display: grid; gap: 6px; padding-block: 8px 18px; }
.hero h1 { font-size: clamp(32px, 7vw, 46px); }
.format { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 22px; }
.fmt { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.fmt b { font-family: var(--f-display); font-size: 20px; display: block; color: var(--brand); }
.fmt .n { font-family: var(--f-display); font-size: 28px; font-variant-numeric: tabular-nums; }
.sets { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.set-card { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 10px; }
.set-card h2 { font-size: 28px; }
.set-card .last { font-size: 14px; color: var(--ink-soft); min-height: 1.4em; }
.set-card .row { display: flex; gap: 8px; flex-wrap: wrap; }
.note { margin-top: 22px; font-size: 14px; color: var(--ink-soft); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; }

/* Exam */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); color: var(--surface); }
.bar-in { max-width: 900px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.bar .title { font-family: var(--f-display); font-size: 19px; flex: 1 1 auto; min-width: 0; }
.bar .title small { display: block; font-family: var(--f-body); font-size: 13px; font-weight: 700; opacity: .85; }
.timer { font-family: var(--f-display); font-size: 24px; font-variant-numeric: tabular-nums; background: var(--surface); color: var(--brand); border-radius: 10px; padding: 0 12px; min-width: 96px; text-align: center; }
.timer.low { background: var(--bad); color: var(--surface); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .7; } }
.bar .btn { background: var(--surface); color: var(--brand); border-color: var(--surface); padding: 6px 16px; min-height: 38px; }
.progress { height: 6px; background: var(--brand-soft); }
.progress i { display: block; height: 100%; width: 0; background: var(--amber); transition: width .25s; }

.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 16px; }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.qno { font-family: var(--f-display); font-size: 18px; color: var(--brand); }
.chip { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 2px 10px; background: var(--brand-soft); color: var(--brand); }
.chip.sec { background: var(--amber-soft); color: var(--amber); }
.qtext { font-size: 19px; font-weight: 700; margin: 0 0 14px; white-space: pre-line; }
.opts { display: grid; gap: 10px; }
.opt { font: 700 17px var(--f-body); color: var(--ink); text-align: left; background: var(--surface-2); border: 2px solid var(--line); border-radius: 12px; padding: 11px 14px; cursor: pointer; display: flex; gap: 12px; align-items: center; min-height: 52px; }
.opt .k { flex: 0 0 auto; font-family: var(--f-display); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
.opt:hover:not(:disabled) { border-color: var(--brand); }
.opt:disabled { cursor: default; }
.opt.ok { background: var(--ok-soft); border-color: var(--ok); }
.opt.ok .k { background: var(--ok); color: var(--surface); }
.opt.bad { background: var(--bad-soft); border-color: var(--bad); }
.opt.bad .k { background: var(--bad); color: var(--surface); }
.opt.dim { opacity: .55; }
.fb { margin-top: 12px; border-radius: 10px; padding: 10px 14px; font-weight: 800; }
.fb.ok { background: var(--ok-soft); color: var(--ok); }
.fb.bad { background: var(--bad-soft); color: var(--bad); }
.fb .why { display: block; color: var(--ink); font-weight: 600; margin-top: 2px; }
.nav { display: flex; gap: 8px; justify-content: space-between; margin-top: 14px; flex-wrap: wrap; }
.nav .mid { display: flex; gap: 8px; }
.hint { font-size: 13px; color: var(--ink-soft); margin-top: 10px; }

.grid-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 16px; }
.grid-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--surface-2); border: 1px solid var(--line); }
.legend .l-ok::before { background: var(--ok); border-color: var(--ok); }
.legend .l-bad::before { background: var(--bad); border-color: var(--bad); }
.secname { font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin: 8px 0 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.grid button { font: 800 14px var(--f-body); font-variant-numeric: tabular-nums; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer; }
.grid button.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.grid button.bad { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.grid button.cur { outline: 3px solid var(--amber); outline-offset: 1px; }

/* Modal-ish confirm (in page) */
.confirm { background: var(--amber-soft); border: 2px solid var(--amber); border-radius: 14px; padding: 14px 16px; margin-top: 16px; display: grid; gap: 10px; }
.confirm .row { display: flex; gap: 8px; flex-wrap: wrap; }

/* Results */
.result { background: var(--surface); border: 2px solid var(--amber); border-radius: 18px; padding: 20px; margin-top: 16px; display: grid; gap: 14px; }
.big { font-family: var(--f-display); font-size: 48px; line-height: 1; color: var(--brand); font-variant-numeric: tabular-nums; }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.score-box { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.score-box b { font-family: var(--f-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.bars { display: grid; gap: 8px; }
.barrow { display: grid; grid-template-columns: 150px 1fr 64px; gap: 10px; align-items: center; font-size: 15px; }
.barrow .track { height: 12px; background: var(--brand-soft); border-radius: 999px; overflow: hidden; }
.barrow .track i { display: block; height: 100%; background: var(--brand); }
.barrow .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; }
.result .row { display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 520px) { .barrow { grid-template-columns: 110px 1fr 56px; font-size: 14px; } .qtext { font-size: 18px; } }

/* Essay */
.essay textarea { width: 100%; min-height: 280px; font: 17px/1.6 var(--f-body); color: var(--ink); background: var(--surface-2); border: 2px solid var(--line); border-radius: 12px; padding: 12px; resize: vertical; }
.essay .count { font-weight: 800; font-variant-numeric: tabular-nums; }
.essay .count.ok { color: var(--ok); }
.essay ul { margin: 6px 0 0; padding-left: 20px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>

<script src="data.js"></script>
<script>
const SETS = 5, TIME_AB = 90 * 60, TIME_C = 45 * 60;
const KEYS = ['A', 'B', 'C', 'D'];
const CATS_B = ['Matematik', 'Logik', 'Sains', 'Bahasa Inggeris', 'Pengetahuan Am'];
const app = document.getElementById('app');
const store = {
  get(k, d) { try { const v = localStorage.getItem('pksk-' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pksk-' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('pksk-' + k); } catch (e) {} },
};
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmt(sec) { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return `${m}:${String(s).padStart(2, '0')}`; }
const questionsOf = n => PKSK.questions.filter(q => q.set === n);

let timerId = null;
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }

/* ---------------- Home ---------------- */
function home() {
  stopTimer();
  window.scrollTo(0, 0);
  const cards = Array.from({ length: SETS }, (_, i) => {
    const n = i + 1, last = store.get('last-' + n, null), live = store.get('run-' + n, null);
    const lastTxt = last ? `Keputusan terakhir: Bahagian B ${last.b}/70 · Bahagian A ${last.a}/30` : 'Belum dicuba';
    return `<div class="set-card">
      <h2>Set ${n}</h2>
      <div class="last">${lastTxt}</div>
      <div class="row">
        ${live ? `<button class="btn" data-resume="${n}">Sambung</button><button class="btn ghost" data-start="${n}">Mula semula</button>`
               : `<button class="btn" data-start="${n}">Mula Set ${n}</button>`}
        <button class="btn ghost" data-essay="${n}">Bahagian C</button>
      </div>
    </div>`;
  }).join('');
  app.innerHTML = `<div class="wrap">
    <header class="hero">
      <span class="eyebrow">Pentaksiran Kemasukan Sekolah Khusus</span>
      <h1>Latih Tubi PKSK</h1>
      <p class="muted" style="margin:0;max-width:62ch">5 set latihan mengikut format PKSK. Setiap set mempunyai 100 soalan objektif yang berbeza. Susunan soalan dan pilihan jawapan dirawak setiap kali dibuka. Jawapan disemak sebaik sahaja dipilih.</p>
    </header>
    <div class="format">
      <div class="fmt"><b>Bahagian A</b><span class="n">30</span> soalan<br><span class="muted">Kecerdasan Insaniah (EQ, SQ, SSQ)</span></div>
      <div class="fmt"><b>Bahagian B</b><span class="n">70</span> soalan<br><span class="muted">IQ: Matematik, Logik, Sains, Bahasa Inggeris, Pengetahuan Am</span></div>
      <div class="fmt"><b>Masa A + B</b><span class="n">90</span> minit<br><span class="muted">Tamat masa, kertas dihantar automatik</span></div>
      <div class="fmt"><b>Bahagian C</b><span class="n">45</span> minit<br><span class="muted">1 esei Bahasa Melayu, sekurang-kurangnya 100 patah perkataan</span></div>
    </div>
    <div class="sets">${cards}</div>
    <p class="note">Bahagian A menilai personaliti, jadi dalam ujian sebenar tiada jawapan betul atau salah. Dalam latihan ini, pilihan yang ditanda hijau ialah <b>jawapan paling sesuai</b> berserta sebabnya. Soalan disediakan sebagai latihan dan bukan soalan sebenar PKSK.</p>
  </div>`;
  app.querySelectorAll('[data-start]').forEach(b => b.onclick = () => start(+b.dataset.start));
  app.querySelectorAll('[data-resume]').forEach(b => b.onclick = () => exam(store.get('run-' + b.dataset.resume)));
  app.querySelectorAll('[data-essay]').forEach(b => b.onclick = () => essay(+b.dataset.essay));
}

/* ---------------- Exam ---------------- */
function start(n) {
  const qs = questionsOf(n);
  const A = shuffle(qs.filter(q => q.sec === 'A').map(q => q.id));
  const B = shuffle(qs.filter(q => q.sec === 'B').map(q => q.id));
  const order = [...A, ...B];
  const opts = {}; order.forEach(id => opts[id] = shuffle([0, 1, 2, 3]));
  const run = { set: n, order, opts, ans: {}, cur: 0, end: Date.now() + TIME_AB * 1000, startedAt: Date.now() };
  store.set('run-' + n, run);
  exam(run);
}

function exam(run) {
  stopTimer();
  const byId = Object.fromEntries(PKSK.questions.map(q => [q.id, q]));
  const total = run.order.length, nA = run.order.filter(id => byId[id].sec === 'A').length;
  const save = () => store.set('run-' + run.set, run);
  let confirming = false;

  app.innerHTML = `
    <div class="bar"><div class="bar-in">
      <div class="title">Set ${run.set}<small id="secLbl"></small></div>
      <div class="timer" id="timer" aria-live="off"></div>
      <button class="btn" id="submit">Hantar</button>
    </div><div class="progress"><i id="prog"></i></div></div>
    <div class="wrap" style="padding-top:0">
      <div id="confirm"></div>
      <div class="qcard" id="qcard"></div>
      <div class="grid-wrap">
        <div class="grid-head"><b>Navigasi soalan</b>
          <div class="legend"><span>Belum dijawab</span><span class="l-ok">Betul</span><span class="l-bad">Salah</span></div></div>
        <div class="secname">Bahagian A · Kecerdasan Insaniah</div><div class="grid" id="gridA"></div>
        <div class="secname">Bahagian B · Kecerdasan Intelektual</div><div class="grid" id="gridB"></div>
      </div>
    </div>`;
  const $ = id => document.getElementById(id);
  const gA = $('gridA'), gB = $('gridB');
  const cells = run.order.map((id, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = i + 1;
    b.setAttribute('aria-label', `Soalan ${i + 1}`);
    b.onclick = () => { run.cur = i; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    (i < nA ? gA : gB).append(b); return b;
  });

  function isCorrect(id) { return run.ans[id] === byId[id].a; }
  function paintGrid() {
    cells.forEach((c, i) => {
      const id = run.order[i];
      c.className = (id in run.ans ? (isCorrect(id) ? 'ok' : 'bad') : '') + (i === run.cur ? ' cur' : '');
    });
    const done = Object.keys(run.ans).length;
    $('prog').style.width = (done / total * 100) + '%';
  }

  function render() {
    const id = run.order[run.cur], q = byId[id], perm = run.opts[id];
    const answered = id in run.ans;
    $('secLbl').textContent = q.sec === 'A' ? 'Bahagian A · Kecerdasan Insaniah' : 'Bahagian B · Kecerdasan Intelektual';
    const optsHtml = perm.map((oi, k) => {
      let cls = 'opt';
      if (answered) cls += oi === q.a ? ' ok' : oi === run.ans[id] ? ' bad' : ' dim';
      return `<button type="button" class="${cls}" data-oi="${oi}" ${answered ? 'disabled' : ''}><span class="k">${KEYS[k]}</span><span>${esc(q.o[oi])}</span></button>`;
    }).join('');
    let fb = '';
    if (answered) {
      const good = isCorrect(id);
      const best = KEYS[perm.indexOf(q.a)];
      if (q.sec === 'A') fb = good ? `<div class="fb ok">✓ Pilihan paling sesuai.<span class="why">${esc(q.why)}</span></div>`
                                   : `<div class="fb bad">Pilihan yang lebih sesuai: ${best}.<span class="why">${esc(q.why)}</span></div>`;
      else fb = good ? `<div class="fb ok">✓ Betul!<span class="why">${esc(q.why)}</span></div>`
                     : `<div class="fb bad">✗ Salah. Jawapan betul: ${best}.<span class="why">${esc(q.why)}</span></div>`;
    }
    $('qcard').innerHTML = `
      <div class="qmeta"><span class="qno">Soalan ${run.cur + 1} / ${total}</span><span class="chip sec">Bahagian ${q.sec}</span><span class="chip">${esc(q.cat)}</span></div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts">${optsHtml}</div>
      ${fb}
      <div class="nav">
        <button class="btn ghost" id="prev" ${run.cur === 0 ? 'disabled' : ''}>← Sebelum</button>
        <div class="mid">
          ${!answered ? `<button class="btn ghost" id="skip">Langkau</button>` : ''}
          <button class="btn" id="next" ${run.cur === total - 1 ? 'disabled' : ''}>Seterusnya →</button>
        </div>
      </div>
      <p class="hint">Papan kekunci: A–D untuk menjawab, ← → untuk bertukar soalan.</p>`;
    $('qcard').querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.oi));
    $('prev').onclick = () => go(-1);
    $('next').onclick = () => go(1);
    if ($('skip')) $('skip').onclick = () => skipToNextUnanswered();
    paintGrid();
  }
  function choose(oi) {
    const id = run.order[run.cur];
    if (id in run.ans) return;
    run.ans[id] = oi; save(); render();
  }
  function go(d) {
    const n = run.cur + d; if (n < 0 || n >= total) return;
    run.cur = n; save(); render();
  }
  function skipToNextUnanswered() {
    for (let k = 1; k <= total; k++) {
      const i = (run.cur + k) % total;
      if (!(run.order[i] in run.ans)) { run.cur = i; save(); render(); return; }
    }
  }
  function tick() {
    const left = (run.end - Date.now()) / 1000;
    const t = $('timer'); if (!t) return stopTimer();
    t.textContent = fmt(left);
    t.classList.toggle('low', left <= 300);
    if (left <= 0) finish(true);
  }
  function askSubmit() {
    if (confirming) return;
    confirming = true;
    const left = total - Object.keys(run.ans).length;
    $('confirm').innerHTML = `<div class="confirm"><b>Hantar kertas sekarang?</b>
      <span>${left ? `${left} soalan belum dijawab dan akan dikira tidak betul.` : 'Semua soalan telah dijawab.'}</span>
      <div class="row"><button class="btn warn" id="yes">Ya, hantar</button><button class="btn ghost" id="no">Teruskan menjawab</button></div></div>`;
    $('yes').onclick = () => finish(false);
    $('no').onclick = () => { confirming = false; $('confirm').innerHTML = ''; };
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function finish(timeUp) {
    stopTimer();
    run.finishedAt = Math.min(Date.now(), run.end);
    run.timeUp = timeUp;
    store.del('run-' + run.set);
    results(run, byId);
  }
  document.onkeydown = e => {
    if (!document.getElementById('qcard') || e.target.tagName === 'TEXTAREA') return;
    const k = e.key.toUpperCase();
    if (KEYS.includes(k)) { const id = run.order[run.cur]; choose(run.opts[id][KEYS.indexOf(k)]); }
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  };
  $('submit').onclick = askSubmit;
  render(); tick();
  timerId = setInterval(tick, 500);
}

/* ---------------- Results ---------------- */
function results(run, byId) {
  document.onkeydown = null;
  window.scrollTo(0, 0);
  const qs = run.order.map(id => byId[id]);
  const ok = q => run.ans[q.id] === q.a;
  const A = qs.filter(q => q.sec === 'A'), B = qs.filter(q => q.sec === 'B');
  const aOk = A.filter(ok).length, bOk = B.filter(ok).length;
  const used = Math.round((run.finishedAt - run.startedAt) / 1000);
  store.set('last-' + run.set, { a: aOk, b: bOk, at: Date.now() });
  const row = (label, list) => { const c = list.filter(ok).length, p = list.length ? c / list.length * 100 : 0;
    return `<div class="barrow"><span>${label}</span><span class="track"><i style="width:${p}%"></i></span><span class="v">${c}/${list.length}</span></div>`; };
  const pct = bOk / B.length;
  const msg = pct >= .8 ? 'Cemerlang! Teruskan latihan untuk kekalkan prestasi.' : pct >= .6 ? 'Bagus. Fokus pada kategori yang paling rendah di bawah.' : 'Teruskan berlatih. Semak semula jawapan dan cuba set ini lagi.';
  app.innerHTML = `<div class="wrap">
    <div class="result">
      <span class="eyebrow">Set ${run.set} · ${run.timeUp ? 'Masa tamat' : 'Kertas dihantar'}</span>
      <h1>Keputusan</h1>
      <div class="scores">
        <div class="score-box">Bahagian B (IQ)<br><b>${bOk} / ${B.length}</b><br><span class="muted">${Math.round(pct * 100)}%</span></div>
        <div class="score-box">Bahagian A (jawapan paling sesuai)<br><b>${aOk} / ${A.length}</b></div>
        <div class="score-box">Masa digunakan<br><b>${fmt(used)}</b><br><span class="muted">daripada 90:00</span></div>
      </div>
      <p style="margin:0">${msg}</p>
      <div class="bars">
        ${CATS_B.map(c => row(c, B.filter(q => q.cat === c))).join('')}
        ${['EQ', 'SQ', 'SSQ'].map(c => row(c, A.filter(q => q.cat === c))).join('')}
      </div>
      <div class="row">
        <button class="btn" id="review">Semak jawapan</button>
        <button class="btn ghost" id="again">Cuba semula Set ${run.set}</button>
        <button class="btn ghost" id="essay">Bahagian C: Esei</button>
        <button class="btn ghost" id="home">Menu utama</button>
      </div>
    </div>
    <div id="rev"></div>
  </div>`;
  document.getElementById('again').onclick = () => start(run.set);
  document.getElementById('home').onclick = home;
  document.getElementById('essay').onclick = () => essay(run.set);
  document.getElementById('review').onclick = () => {
    const html = qs.map((q, i) => {
      const perm = run.opts[q.id], mine = run.ans[q.id];
      const st = !(q.id in run.ans) ? 'Tidak dijawab' : ok(q) ? '✓' : '✗';
      const opts = perm.map((oi, k) => `<div class="opt ${oi === q.a ? 'ok' : oi === mine ? 'bad' : 'dim'}" style="cursor:default"><span class="k">${KEYS[k]}</span><span>${esc(q.o[oi])}</span></div>`).join('');
      return `<div class="qcard"><div class="qmeta"><span class="qno">${i + 1}. ${st}</span><span class="chip sec">Bahagian ${q.sec}</span><span class="chip">${esc(q.cat)}</span></div>
        <p class="qtext">${esc(q.q)}</p><div class="opts">${opts}</div><div class="fb ${ok(q) ? 'ok' : 'bad'}"><span class="why">${esc(q.why)}</span></div></div>`;
    }).join('');
    document.getElementById('rev').innerHTML = html;
    document.getElementById('rev').scrollIntoView({ behavior: 'smooth' });
  };
}

/* ---------------- Bahagian C: Esei ---------------- */
function essay(n) {
  stopTimer(); document.onkeydown = null; window.scrollTo(0, 0);
  const e = PKSK.essays[n - 1];
  const draft = store.get('essay-' + n, { text: '', end: null });
  app.innerHTML = `
    <div class="bar"><div class="bar-in">
      <div class="title">Set ${n}<small>Bahagian C · Artikulasi Penulisan</small></div>
      <div class="timer" id="timer">${fmt(TIME_C)}</div>
      <button class="btn" id="startC">${draft.end ? 'Set semula masa' : 'Mula masa'}</button>
    </div></div>
    <div class="wrap essay">
      <div class="qcard">
        <div class="qmeta"><span class="chip sec">Esei</span><span class="chip">Sekurang-kurangnya 100 patah perkataan</span></div>
        <p class="qtext">${esc(e.prompt)}</p>
        <textarea id="txt" placeholder="Tulis esei anda di sini...">${esc(draft.text)}</textarea>
        <p>Bilangan perkataan: <span class="count" id="count">0</span> / 100</p>
        <div class="nav"><button class="btn ghost" id="tips">Tunjuk isi cadangan</button><button class="btn ghost" id="back">Menu utama</button></div>
        <div id="tipsBox"></div>
      </div>
      <p class="note">Bahagian C tidak disemak secara automatik. Minta ibu bapa atau guru membaca esei ini. Tulisan disimpan dalam pelayar ini sahaja.</p>
    </div>`;
  const $ = id => document.getElementById(id);
  const txt = $('txt');
  const count = () => { const w = txt.value.trim().split(/\s+/).filter(Boolean).length; $('count').textContent = w; $('count').classList.toggle('ok', w >= 100); };
  txt.oninput = () => { draft.text = txt.value; store.set('essay-' + n, draft); count(); };
  count();
  $('back').onclick = home;
  $('tips').onclick = () => { $('tipsBox').innerHTML = `<div class="fb ok" style="color:var(--ink)"><b>Isi cadangan</b><ul>${e.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`; };
  function tick() {
    const t = $('timer'); if (!t) return stopTimer();
    if (!draft.end) { t.textContent = fmt(TIME_C); return; }
    const left = (draft.end - Date.now()) / 1000;
    t.textContent = fmt(left); t.classList.toggle('low', left <= 300 && left > 0);
    if (left <= 0) { t.textContent = 'Tamat'; t.classList.remove('low'); }
  }
  $('startC').onclick = () => { draft.end = Date.now() + TIME_C * 1000; store.set('essay-' + n, draft); $('startC').textContent = 'Set semula masa'; tick(); };
  tick(); timerId = setInterval(tick, 500);
}

if (typeof PKSK === 'undefined') app.innerHTML = '<div class="wrap"><p>Fail soalan (data.js) tidak dapat dimuatkan.</p></div>';
else home();
</script>
